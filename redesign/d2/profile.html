<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet — Ma collection · Captain Coaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  .cover { border-bottom: 1.5px solid var(--ink); padding: clamp(28px, 4vw, 50px) 0 clamp(24px, 3vw, 38px); }
  .cover-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: clamp(24px, 4vw, 52px); align-items: end; }
  .cover-avatar { width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--brass); }

  /* La rétrospective annuelle : gratuite, partageable, c'est la leçon Letterboxd. */
  .season { background: var(--ink); color: var(--paper); border-radius: 3px; padding: clamp(24px, 3vw, 34px); }
  .season .cap { color: rgba(237, 233, 222, .58); }
  .season h2 { color: var(--paper); }
  .season-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 24px; }
  .season-stat b { display: block; font-family: var(--ff-display); font-weight: 800; font-size: clamp(26px, 3vw, 38px); line-height: 1; }
  .season-stat span { display: block; font-family: var(--ff-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(237,233,222,.58); margin-top: 7px; }

  .fambar { display: grid; grid-template-columns: 132px minmax(0, 1fr) 44px; gap: 12px; align-items: center; padding: 5px 0; }
  .fambar-track { height: 9px; background: var(--paper-3); border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .fambar-fill { height: 100%; }

  @media (max-width: 900px) {
    .cover-grid { grid-template-columns: minmax(0, 1fr); }
    .season-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { getData, masthead, foot, gauge, photo, tallPhoto, family, FAMILIES, serial, longDate, year, stars, esc, num, avatar } from "./d2.js";
import { riderView, HERO_USER_ID } from "../assets/data.js";

const d = await getData();
const u = riderView(d, HERO_USER_ID);
const taxo = await fetch(new URL("../../data/taxonomies.json", import.meta.url)).then((r) => r.json());

const stat = (k) => u.stats?.[k] ?? null;
const credits = Number(String(stat("coasters") || "0").replace(/\D/g, "")) || 0;
const parksN = Number(String(stat("parks") || "0").replace(/\D/g, "")) || 0;
const countries = Number(String(stat("countries") || "0").replace(/\D/g, "")) || 0;
const [topDone, topTotal] = String(stat("World TOP 100") || "0/100").split("/").map(Number);

const entries = u.ratings.filter((r) => r.coaster).map((r) => ({ ...r, y: year(r.riddenAt) }));
/* La saison mise en avant est celle qui compte le plus d'entrees datees :
   l'extrait ne couvre qu'une partie des credits, la plus recente serait vide. */
const byYear = new Map();
for (const e of entries) if (e.y) byYear.set(e.y, (byYear.get(e.y) || 0) + 1);
const season = [...byYear.entries()].sort((a, b) => b[1] - a[1] || b[0] - a[0])[0]?.[0] || null;
const seasonEntries = entries.filter((e) => e.y === season);

/* Couverture par famille : ce que la collection dit du goût du rider. */
const famStats = FAMILIES.map((f) => {
  const total = d.ranking.filter((c) => c.seatingType === f.match).length;
  const done = u.topItems.filter((c) => c.seatingType === f.match).length +
    entries.filter((e) => e.coaster.seatingType === f.match && !u.topItems.some((x) => x.id === e.coasterId)).length;
  return { ...f, total, done };
})
  .filter((f) => f.total >= 20)
  .sort((a, b) => b.done - a.done || b.total - a.total);
const famMax = Math.max(1, ...famStats.map((f) => f.done));

const bestSeason = [...seasonEntries].sort((a, b) => b.value - a.value)[0];
const newCountries = new Set(seasonEntries.map((e) => e.coaster.country)).size;
const newParks = new Set(seasonEntries.map((e) => e.coaster.parkId)).size;

document.getElementById("app").innerHTML = `
${masthead("profile")}
<main id="main">

  <!-- ------------------------------------------------------------ couverture -->
  <section class="cover">
    <div class="wrap">
      <div class="cover-grid">
        <div>
          <div style="display:flex;gap:18px;align-items:center">
            <img class="cover-avatar" src="${avatar(u.name, 152)}" alt="">
            <div>
              <div class="cap cap-ticket">Collection de</div>
              <h1 style="margin-top:6px">${esc(u.name)}</h1>
            </div>
          </div>
          <p class="lede" style="margin-top:20px">
            ${num(credits)} coasters, ${num(parksN)} parcs, ${num(countries)} pays.
            ${stat("Favorite Manufacturer") ? `Constructeur de cœur : ${esc(stat("Favorite Manufacturer"))}.` : ""}
          </p>
        </div>
        <div style="display:grid;gap:18px">
          ${gauge("Top 100 mondial", topDone, topTotal, "le jalon le plus suivi de la communauté")}
          ${gauge("Pays", countries, taxo.country.length, "sur les pays référencés", true)}
          ${gauge("Parcs", parksN, d.parks.length, "sur les parcs de la base", true)}
        </div>
      </div>
    </div>
  </section>

  <!-- ---------------------------------------------------------- ma saison -->
  <section class="sect">
    <div class="wrap">
      <div class="season">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap">
          <div>
            <div class="cap">Rétrospective</div>
            <h2 style="margin-top:8px">Ma saison ${season}</h2>
          </div>
          <a class="btn btn-sm" href="#" style="background:var(--paper);border-color:var(--paper);color:var(--ink)">Partager</a>
        </div>
        <div class="season-stats">
          <div class="season-stat"><b>${num(seasonEntries.length)}</b><span>Nouveaux credits</span></div>
          <div class="season-stat"><b>${num(newParks)}</b><span>Parcs de l'année</span></div>
          <div class="season-stat"><b>${num(newCountries)}</b><span>Pays de l'année</span></div>
          <div class="season-stat"><b>${bestSeason ? bestSeason.value.toFixed(1) : "—"}</b><span>Meilleure note</span></div>
        </div>
        ${bestSeason ? `
        <p style="margin:26px 0 0;font-size:17px;max-width:66ch;color:rgba(237,233,222,.86)">
          Ton coup de cœur de la saison : <b style="color:var(--paper)">${esc(bestSeason.coaster.name)}</b>
          à ${esc(d.parkById.get(bestSeason.coaster.parkId)?.name || "")}, noté ${bestSeason.value.toFixed(1)} le ${longDate(bestSeason.riddenAt)}.
        </p>` : ""}
        <p class="cap" style="margin:20px 0 0">Publiée à la fermeture des parcs · gratuite, comme le reste du carnet</p>
      </div>
    </div>
  </section>

  <!-- -------------------------------------------------------- mur de credits -->
  <section class="sect" style="padding-top:0">
    <div class="wrap">
      <div class="sect-head">
        <div>
          <div class="cap">La collection est le visuel</div>
          <h2 style="margin-top:8px">Mon top ${u.topItems.length}</h2>
        </div>
        <span class="mono dim" style="font-size:13px">glisser pour réordonner</span>
      </div>
      <div class="wall">
        ${u.topItems.slice(0, 18).map((c, i) => `
        <a class="wall-item" href="coaster.html">
          <span class="wall-n">${i + 1}</span>
          <img src="${tallPhoto(c.id)}" alt="" loading="lazy">
          <span class="wall-cap">
            <b>${esc(c.name)}</b>
            <span>${c.rank ? `#${c.rank} mondial` : "non classé"}</span>
          </span>
        </a>`).join("")}
      </div>
      <p class="note" style="margin-top:20px">
        Un top personnel produit un duel pour chaque paire : ${u.topItems.length} coasters classés,
        ce sont ${num((u.topItems.length * (u.topItems.length - 1)) / 2)} comparaisons versées au classement mondial.
      </p>
    </div>
  </section>

  <!-- ------------------------------------------------------ familles + talons -->
  <section class="sect sect-alt">
    <div class="wrap">
      <div class="cols-2" style="align-items:start">

        <div>
          <div class="sect-head">
            <div>
              <div class="cap">Couverture par famille</div>
              <h2 style="margin-top:8px">Ce que dit ta collection</h2>
            </div>
          </div>
          ${famStats.map((f) => `
          <div class="fambar">
            <span class="fam fam-${f.key}">${f.label}</span>
            <span class="fambar-track"><span class="fambar-fill" style="width:${(f.done / famMax) * 100}%;background:var(--fam-${f.key})"></span></span>
            <span class="mono" style="font-size:12.5px;text-align:right">${f.done}</span>
          </div>`).join("")}
          <p class="note" style="margin-top:20px">
            Récompenser la couverture — familles, pays, jalons — plutôt que le volume :
            c'est ce qui distingue une collection d'une course au chiffre.
          </p>
        </div>

        <div>
          <div class="sect-head">
            <div>
              <div class="cap">Talons</div>
              <h2 style="margin-top:8px">Dernières entrées</h2>
            </div>
          </div>
          <div style="display:grid;gap:12px">
            ${entries.slice(0, 5).map((e) => `
            <article class="ticket">
              <div class="ticket-body">
                <div class="cap cap-green">${longDate(e.riddenAt)}</div>
                <div class="ticket-name" style="margin-top:5px">${esc(e.coaster.name)}</div>
                <div class="ticket-meta">${esc(d.parkById.get(e.coaster.parkId)?.name || "")} · ${esc(e.coaster.country)}</div>
                <div style="margin-top:9px"><span class="fam fam-${family(e.coaster).key}">${family(e.coaster).label}</span></div>
              </div>
              <div class="ticket-stub">
                <span class="cap" style="font-size:9px">Ma note</span>
                <span class="ticket-score">${e.value.toFixed(1)}</span>
                <span class="ticket-serial">${serial(u.id, e.coasterId, e.riddenAt)}</span>
              </div>
            </article>`).join("")}
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------- ses avis -->
  ${u.reviews.length ? `
  <section class="sect">
    <div class="wrap">
      <div class="sect-head"><h2>Mes avis</h2><span class="mono dim" style="font-size:13px">${u.reviews.length} rédigés</span></div>
      <div class="cols-2">
        ${u.reviews.slice(0, 4).map((r) => {
          const c = d.coasterById.get(r.coasterId);
          return `
        <article class="sheet">
          <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
            <img src="${photo(r.coasterId)}" alt="" style="width:64px;height:42px;object-fit:cover;border-radius:2px;border:1px solid var(--rule)">
            <div style="flex:1;min-width:0">
              <div class="serif" style="font-weight:700;font-size:16px">${esc(c?.name || "")}</div>
              <div class="gauge-note">${esc(d.parkById.get(c?.parkId)?.name || "")} · ${esc(r.ago)}</div>
            </div>
            <span class="stars" style="color:var(--ticket);letter-spacing:2px">${stars(r.rating)}</span>
          </div>
          ${r.text ? `<p style="margin:0 0 12px;font-size:15.5px;line-height:1.62">${esc(r.text)}</p>` : ""}
          <div style="display:flex;gap:7px;flex-wrap:wrap">
            ${(r.pros || []).map((p) => `<span class="chip chip-plus">${esc(p)}</span>`).join("")}
            ${(r.cons || []).map((p) => `<span class="chip chip-minus">${esc(p)}</span>`).join("")}
          </div>
        </article>`;
        }).join("")}
      </div>
    </div>
  </section>` : ""}

</main>
${foot(`Credits, parcs, pays et couverture du top 100 sont les statistiques réelles publiées sur le profil.
Le top personnel, les notes datées et les avis proviennent du jeu de données extrait du site.
Photographies : Unsplash.`)}
`;
</script>
</body>
</html>
